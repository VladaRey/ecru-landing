name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одночасно тільки один деплой; чергу не скасовуємо, щоб останній пуш
# не з'їв попередній на півдорозі.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Сайт більше не є тим, що лежить у репозиторії: сторінка на кожну мову
      # збирається з src/index.html та i18n/*.json. setup-node не потрібен —
      # на ubuntu-latest Node уже є, а залежностей у build.js немає.
      - run: node build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
